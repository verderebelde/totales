<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Verde Rebelde · Totales</title>
<meta name="theme-color" content="#2e7d32">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="https://lh3.googleusercontent.com/d/1p5CySNTWSX8fl02aYOr1VVRlTWLSZI-e">
<link rel="apple-touch-icon" href="https://lh3.googleusercontent.com/d/1p5CySNTWSX8fl02aYOr1VVRlTWLSZI-e=s180-c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Verde Rebelde">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --primary:#2e7d32; --primary-dark:#1b5e20; --primary-light:#e8f5e9;
  --accent:#66bb6a; --text:#2f3e2f; --bg:#f8faf8; --muted:#7a8f7a;
}
*{box-sizing:border-box}
body{margin:0;font-family:'Montserrat',sans-serif;background:var(--bg);color:var(--text);padding:0 14px 40px}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 0 10px;border-bottom:1px solid #e3ece3;margin-bottom:12px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.marca{display:flex;align-items:center;gap:10px}
.marca img{height:38px;width:38px;border-radius:9px;object-fit:contain;background:white}
h1{margin:0;font-size:20px;color:var(--primary)}
.estado{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;margin-top:4px}
.punto{width:8px;height:8px;border-radius:50%;background:var(--accent);flex:none}
.punto.error{background:#e57373}
.btn-refrescar{border:none;background:var(--primary-light);color:var(--primary);font:600 13px 'Montserrat';padding:8px 12px;border-radius:10px}
.tabs{display:flex;gap:4px;margin-top:10px;background:#e8f0e8;padding:4px;border-radius:12px}
.tab{flex:1;border:none;background:transparent;font:600 12.5px 'Montserrat';color:var(--muted);padding:9px 2px;border-radius:9px;white-space:nowrap}
.tab.activa{background:white;color:var(--primary);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.contadores{display:flex;gap:8px;margin-top:10px;font-size:13px;flex-wrap:wrap}
.chip{background:white;border:1px solid #e3ece3;border-radius:20px;padding:5px 12px}
.chip b{color:var(--primary)}
h2{font-size:14px;text-transform:uppercase;letter-spacing:.5px;color:var(--primary);margin:20px 0 8px;border-left:4px solid var(--accent);padding-left:10px}
.card{background:white;border:1px solid #e6efe6;border-radius:16px;padding:14px 16px;margin-bottom:12px;box-shadow:0 3px 10px rgba(0,0,0,.03)}
.card.nuevo{animation:flash 2.5s ease-out;border-color:var(--accent)}
@keyframes flash{0%{background:#d7f5d9}100%{background:white}}
.fila1{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.nombre{font-weight:700;font-size:17px}
.total{font-weight:700;color:var(--primary);white-space:nowrap}
.meta{font-size:12px;color:var(--muted);margin:2px 0 10px}
.meta a{color:var(--muted)}
.items{white-space:pre-wrap;font-size:13.5px;line-height:1.5;background:var(--bg);border-radius:10px;padding:10px 12px;margin:0}
.obs{margin-top:8px;font-size:13px;background:#fffbea;border:1px solid #f0e2a3;color:#6b5b00;border-radius:10px;padding:8px 12px}
.btn-wa{display:block;text-align:center;margin-top:12px;background:var(--primary);color:white;text-decoration:none;font-weight:700;font-size:15px;padding:14px;border-radius:12px;letter-spacing:.5px}
.btn-wa:active{background:var(--primary-dark)}
.card.ok{opacity:.7}
.card.ok .items{font-size:12.5px}
.ok-row{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:13px}
.ok-row span{color:var(--primary);font-weight:600}
.link-btn{background:none;border:none;color:var(--muted);text-decoration:underline;font:500 12px 'Montserrat';padding:4px}
.vacio{text-align:center;color:var(--muted);font-size:14px;padding:30px 0}
details.pasados summary{cursor:pointer;list-style:none}
details.pasados summary::-webkit-details-marker{display:none}
.tot-fila{display:flex;justify-content:space-between;align-items:center;gap:10px;background:white;border:1px solid #e6efe6;border-radius:12px;padding:10px 14px;margin-bottom:6px}
.tot-nombre{font-weight:600;font-size:14px}
.tot-det{font-size:11.5px;color:var(--muted);margin-top:2px}
.tot-cant{font-weight:700;font-size:17px;color:var(--primary);white-space:nowrap;text-align:right;display:flex;flex-direction:column;align-items:flex-end}
.dif{font-size:12px;font-weight:700;margin-top:3px;padding:2px 8px;border-radius:8px;display:inline-block}
.dif.sobra{background:#e8f5e9;color:#2e7d32}
.dif.falta{background:#fdecea;color:#c62828}
.dif.justo{background:#f1f1f1;color:#777}
.oculto{display:none}
.tot-fila.cero .tot-nombre{color:#9aa89a;font-weight:500}
.tot-fila.cero .tot-cant{color:#b5c2b5}
.tot-fila.suma{background:#fff8e1;border:1.5px solid #ffcc80;margin-top:-2px;margin-bottom:12px}
.tot-fila.suma .tot-nombre{color:#e65100}
.tot-fila.suma .tot-cant{color:#e65100}
/* listas de envío (8 AM y mensaje) */
.acciones{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 12px}
.btn-sec{border:1.5px solid var(--primary);background:white;color:var(--primary);font:600 13px 'Montserrat';padding:10px 12px;border-radius:10px;flex:1;min-width:140px}
.btn-sec:disabled{opacity:.5}
.persona{display:flex;justify-content:space-between;align-items:center;gap:10px;background:white;border:1px solid #e6efe6;border-radius:12px;padding:10px 12px;margin-bottom:6px}
.persona.enviado{opacity:.5}
.persona .pn{font-weight:600;font-size:15px}
.persona .pm{font-size:12px;color:var(--muted)}
.btn-enviar{background:var(--primary);color:white;text-decoration:none;font-weight:700;font-size:14px;padding:10px 14px;border-radius:10px;white-space:nowrap}
.persona.enviado .btn-enviar{background:#9e9e9e}
.aviso{font-size:12.5px;color:var(--muted);margin:0 0 10px}
textarea{width:100%;min-height:110px;font:15px 'Montserrat';padding:12px;border-radius:12px;border:1.5px solid #dfe9df;background:white;color:var(--text)}
.previa{font-size:13px;background:#fffbea;border:1px solid #f0e2a3;color:#6b5b00;border-radius:10px;padding:10px 12px;margin:8px 0 12px;white-space:pre-wrap}

.buscar{width:100%;font:15px 'Montserrat';padding:10px 12px;border-radius:12px;border:1.5px solid #dfe9df;background:white;margin:0 0 12px}
.ped{background:white;border:1px solid #e6efe6;border-radius:14px;padding:12px 14px;margin-bottom:12px}
.ped-cab{display:flex;justify-content:space-between;align-items:baseline;gap:10px;border-bottom:2px solid var(--text);padding-bottom:4px;margin-bottom:4px}
.ped-nombre{font-weight:700;font-size:17px}
.ped-total{font-weight:700;color:var(--primary);white-space:nowrap}
.ped-notas{font-size:12.5px;font-style:italic;color:#6b5b00;margin:4px 0}
.linea{display:grid;grid-template-columns:1fr auto 52px 64px;gap:8px;align-items:center;font-size:13.5px;padding:5px 0;border-bottom:1px solid #eef2ee}
.linea:last-child{border-bottom:none}
.l-prod{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.l-fmt{font-size:11.5px;color:var(--muted);text-align:center}
.l-cant{font-weight:700;font-size:16px;text-align:center}
.l-tot{text-align:right;font-size:12.5px;color:var(--muted)}
</style>
</head>
<body>

<header>
  <div class="top">
    <div class="marca"><img src="https://lh3.googleusercontent.com/d/1p5CySNTWSX8fl02aYOr1VVRlTWLSZI-e" alt="Verde Rebelde"><h1>Totales</h1></div>
    <button class="btn-refrescar" onclick="cargar()">↻ Actualizar</button>
  </div>
  <div class="estado"><span class="punto" id="punto"></span><span id="estado">Cargando…</span></div>
  <div class="tabs">
    <button class="tab activa" id="tab-totales" onclick="verVista('totales')">⚖️ Totales</button>
    <button class="tab" id="tab-pedidos" onclick="verVista('pedidos')">📦 Pedidos (BYS) <span id="n-ped"></span></button>
  </div>
</header>

<div id="vista-totales">
  <div id="totales"><div class="vacio">Cargando…</div></div>
</div>

<div id="vista-pedidos" class="oculto">
  <input class="buscar" id="buscar" placeholder="🔍 Buscar cliente o producto…" oninput="pintarPedidos()">
  <div id="pedidos"><div class="vacio">Cargando…</div></div>
</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbwdQsPAPbOUmlxw-L7N-_gjRVG3Yl451xGmYrLa1rLxxMUoNVYphOxWbQ6kvfb_6q2OoA/exec";
const CADA_SEGUNDOS = 30;
let totales = [];
let pedidosBys = [];
let cargando = false;

function esc(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function num(n){ return String(Math.round(n * 100) / 100).replace(".", ","); }
function cantidad(n, formato){
  return formato.toLowerCase() === "kg" ? num(n) + " kg" : num(n) + " × " + esc(formato || "ud");
}

function llamar(params, segundos){
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), (segundos || 60) * 1000);
  return fetch(API_URL + "?" + params + "&t=" + Date.now(), { cache: "no-store", signal: ctrl.signal })
    .then(r => r.json())
    .then(d => { clearTimeout(t); if (!d || !d.ok) throw new Error(d && d.error || "respuesta vacía"); return d; })
    .catch(err => { clearTimeout(t); throw err; });
}
function msgError(err){ return err.name === "AbortError" ? "no responde" : err.message; }

function estado(texto, error){
  document.getElementById("estado").textContent = texto;
  document.getElementById("punto").classList.toggle("error", !!error);
}

function verVista(v){
  ["totales","pedidos"].forEach(x => {
    document.getElementById("vista-" + x).classList.toggle("oculto", x !== v);
    document.getElementById("tab-" + x).classList.toggle("activa", x === v);
  });
  document.querySelector("h1").textContent = v === "totales" ? "Totales" : "Pedidos";
}

// ---- Sumas de productos que se piden en distintos formatos ----
// Para añadir otro (por ejemplo mandarinas de 1 y 3 kg) basta con una línea más.
//   palabra: lo que tiene que aparecer en el nombre del producto
//   tipo "kg": suma en kilos (formato "kg" = 1 kg, "3 kg" = 3 kg, "5 kg" = 5 kg…)
//   tipo "cartones": huevos (½ docena = 0,5 docenas; 1 cartón = 2,5 docenas)
const SUMAS = [
  { titulo: "TOMATES TOTALES",    palabra: "TOMATE",    tipo: "kg" },
  { titulo: "MANDARINAS TOTALES", palabra: "MANDARINA", tipo: "kg" },
  { titulo: "NARANJAS TOTALES",   palabra: "NARANJA",   tipo: "kg" },
  { titulo: "HUEVOS CARTONES",    palabra: "HUEVO",     tipo: "cartones" }
];
const DOCENAS_POR_CARTON = 2.5;

// Cuánto vale 1 unidad del producto en la unidad de la suma (o null si no entra)
function factor(t, tipo){
  const f = String(t.formato || "").toLowerCase().trim();
  const n = String(t.nombre || "").toLowerCase();
  if (tipo === "kg") {
    let m = f.match(/^(\d+(?:[.,]\d+)?)\s*kg$/);
    if (m) return parseFloat(m[1].replace(",", "."));
    if (f === "kg") { m = n.match(/(\d+(?:[.,]\d+)?)\s*kg/); return m ? parseFloat(m[1].replace(",", ".")) : 1; }
    return null;                                   // ml, unidad… no se suma
  }
  if (tipo === "cartones") {
    const txt = f + " " + n;
    if (/1\/2\s*docena|media\s*docena/.test(txt)) return 0.5 / DOCENAS_POR_CARTON;
    if (/docena/.test(txt)) return 1 / DOCENAS_POR_CARTON;
    return null;
  }
  return null;
}

function filaSuma(s, miembros){
  let pedido = 0, dif = 0, hayDif = false, detalle = [];
  miembros.forEach(({t, k}) => {
    pedido += t.total * k;
    if (t.dif !== null) { dif += t.dif * k; hayDif = true; }
    detalle.push(num(t.total) + " × " + esc(t.formato || t.nombre));
  });
  const unidad = s.tipo === "kg" ? " kg" : (Math.abs(pedido - 1) < 0.001 ? " cartón" : " cartones");
  let difHtml = "";
  if (hayDif) {
    dif = Math.round(dif * 100) / 100;
    if (dif > 0)      difHtml = `<div class="dif sobra">sobran ${num(dif)}</div>`;
    else if (dif < 0) difHtml = `<div class="dif falta">faltan ${num(-dif)}</div>`;
    else              difHtml = `<div class="dif justo">justo</div>`;
  }
  const extra = s.tipo === "cartones" ? " · " + num(pedido * DOCENAS_POR_CARTON) + " docenas" : "";
  return `
    <div class="tot-fila suma">
      <div><div class="tot-nombre">Σ ${esc(s.titulo)}</div><div class="tot-det">${detalle.join(" + ")}${extra}</div></div>
      <div class="tot-cant">${num(pedido)}${unidad}${difHtml}</div>
    </div>`;
}

function pintarTotales(){
  const cont = document.getElementById("totales");
  if (!totales.length) { cont.innerHTML = '<div class="vacio">No se encontraron productos en TOTALES</div>'; return; }

  // qué productos entran en cada suma, y después de cuál se pinta la suma
  const grupos = SUMAS.map(s => ({ s, miembros: [] }));
  totales.forEach((t, i) => {
    const nombre = String(t.nombre).toUpperCase();
    grupos.forEach(g => {
      if (nombre.indexOf(g.s.palabra) === -1) return;
      const k = factor(t, g.s.tipo);
      if (k !== null) g.miembros.push({ t, k, i });
    });
  });
  const despuesDe = {};
  grupos.filter(g => g.miembros.length >= 2).forEach(g => {
    const ultimo = g.miembros[g.miembros.length - 1].i;
    (despuesDe[ultimo] = despuesDe[ultimo] || []).push(filaSuma(g.s, g.miembros));
  });

  let html = "", cat = null;
  totales.forEach((t, i) => {
    if (t.categoria !== cat) { cat = t.categoria; html += `<h2>${esc(cat)}</h2>`; }
    let dif = "";
    if (t.dif !== null) {
      if (t.dif > 0)      dif = `<div class="dif sobra">sobran ${num(t.dif)}</div>`;
      else if (t.dif < 0) dif = `<div class="dif falta">faltan ${num(-t.dif)}</div>`;
      else                dif = `<div class="dif justo">justo</div>`;
    }
    html += `
      <div class="tot-fila ${t.total ? '' : 'cero'}">
        <div><div class="tot-nombre">${esc(t.nombre)}</div><div class="tot-det">${t.hay !== null ? "hay " + num(t.hay) : ""}</div></div>
        <div class="tot-cant">${t.total ? cantidad(t.total, t.formato) : "0"}${dif}</div>
      </div>`;
    if (despuesDe[i]) html += despuesDe[i].join("");
  });
  cont.innerHTML = html;
}


/* ---------- PEDIDOS tal como están en BYS ---------- */
function pintarPedidos(){
  const q = document.getElementById("buscar").value.trim().toLowerCase();
  const lista = pedidosBys.filter(p => !q || p.nombre.toLowerCase().includes(q) ||
                                       p.items.some(it => it.producto.toLowerCase().includes(q)));
  document.getElementById("n-ped").textContent = pedidosBys.length ? "(" + pedidosBys.length + ")" : "";
  const cont = document.getElementById("pedidos");
  if (!pedidosBys.length) { cont.innerHTML = '<div class="vacio">No hay pedidos cargados en BYS</div>'; return; }
  if (!lista.length) { cont.innerHTML = '<div class="vacio">Nada coincide con la búsqueda</div>'; return; }
  cont.innerHTML = lista.map(p => {
    const total = p.items.reduce((s, it) => s + it.precio * it.cantidad, 0);
    const lineas = p.items.map(it => `
      <div class="linea">
        <div class="l-prod">${esc(it.producto)}</div>
        <div class="l-fmt">${esc(it.formato)}</div>
        <div class="l-cant">${num(it.cantidad)}</div>
        <div class="l-tot">${num(it.precio * it.cantidad)} €</div>
      </div>`).join("");
    return `
      <div class="ped">
        <div class="ped-cab"><span class="ped-nombre">${esc(p.nombre)}</span><span class="ped-total">${num(total)} €</span></div>
        ${p.notas ? `<div class="ped-notas">${esc(p.notas)}</div>` : ""}
        ${lineas}
      </div>`;
  }).join("");
}

function cargar(){
  if (cargando) return;
  cargando = true;
  llamar("action=datosvista")
    .then(d => {
      cargando = false;
      totales = d.totales || [];
      pedidosBys = d.bys || [];
      pintarTotales();
      pintarPedidos();
      estado("Actualizado " + new Date().toLocaleTimeString("es-ES") + " · se actualiza solo");
    })
    .catch(err => {
      cargando = false;
      estado("Error: " + msgError(err) + " · reintentando…", true);
    });
}

cargar();
setInterval(() => { if (!document.hidden) cargar(); }, CADA_SEGUNDOS * 1000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) cargar(); });
</script>
</body>
</html>
